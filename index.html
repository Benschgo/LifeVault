<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeVault</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19212a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Schule und Alltag organisiert an einem Ort: Unterlagen, Notizen, Fotos, Aufgaben und Kalender">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=tresor">
<link rel="apple-touch-icon" href="icon-192.png?v=tresor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Gestaltung „Werkstatt“: Zeichengrau, Tusche, Leitungsblau für Bedienung, Signalgelb nur für heute/Hauptaktion,
   DIN-Schrift für Titel, Zahlen und Beschriftungen, Lernfeld-Farben als „Adern“, Schraffur für freie Tage. */
:root{
  --bg:#e7eaee;--card:#ffffff;--bar:rgba(255,255,255,.96);--text:#18212c;--muted:#5b6775;--line:#cfd5dc;--line-strong:#9aa5b1;
  --accent:#1d5faa;--accent-ink:#ffffff;--accent-soft:#e3ecf7;--danger:#c8102e;--warn:#b45700;--ok:#23843b;
  --accent2:#0e7c86;--accent2-ink:#ffffff;--accent2-soft:#ddf0f1;
  --brand:#c8102e;--brand-ink:#ffffff;--brand-soft:#fbe5e8;--brand-edge:#7a0a1c;--orange:#c2410c;
  --signal:#f5b700;--signal-ink:#18212c;
  --radius:6px;--radius-s:3px;--shadow:0 1px 0 rgba(24,33,44,.07);
  --font-d:"Bahnschrift","DIN Alternate","DIN 2014","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --hatch:repeating-linear-gradient(135deg,color-mix(in srgb,var(--danger) 30%,transparent) 0 1.5px,transparent 1.5px 6px);
  /* Hintergrund: Zeichenraster + Lichtverlauf (sehr zurückhaltend) */
  /* Kalendertage: deckende Flächen, aus Grund- und Kartenfarbe gemischt (hell und dunkel) */
  --cell:color-mix(in srgb,var(--text) 5%,var(--card));--cell-we:color-mix(in srgb,var(--bg) 75%,var(--card));--cell-out:color-mix(in srgb,var(--bg) 55%,var(--card));
  --bg-top:#eef1f4;--bg-bottom:#dde2e7;--grid:rgba(24,33,44,.07);--grid-major:rgba(24,33,44,.12);--glow:rgba(200,16,46,.09);--glow2:rgba(29,95,170,.09);
  --nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151b;--card:#1a222c;--bar:rgba(25,33,42,.96);--text:#e4e9ee;--muted:#97a3b0;--line:#2b3540;--line-strong:#4a5663;
    --accent:#6ea6e8;--accent-ink:#0f1419;--accent-soft:#1d2c3d;--danger:#f0626b;--warn:#f0a23b;--ok:#5cc27a;
    --accent2:#4fc1c9;--accent2-ink:#0f1419;--accent2-soft:#143235;--signal-ink:#11161c;
    --brand:#d93a45;--brand-soft:#3a1c22;--brand-edge:#4d0a12;--orange:#fb8c3c;
    --bg-top:#151d26;--bg-bottom:#0a0d11;--grid:rgba(160,190,220,.08);--grid-major:rgba(160,190,220,.15);--glow:rgba(217,58,69,.22);--glow2:rgba(70,130,200,.17);
    --shadow:0 1px 0 rgba(0,0,0,.35);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
/* Grund: Lichtverlauf von oben (wie eine Lampe über der Werkbank) mit leichtem rotem Schimmer,
   darüber ein feines Zeichenraster, das nach unten ausblendet. Beides fest stehend, Inhalte scrollen darüber. */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:radial-gradient(90% 50% at 100% 4%,var(--glow),transparent 72%),radial-gradient(95% 55% at 0% 100%,var(--glow2),transparent 72%),
  linear-gradient(180deg,var(--bg-top),var(--bg) 45%,var(--bg-bottom))}
body::after{background:
  linear-gradient(var(--grid-major) 1px,transparent 1px) -1px -1px/120px 120px,
  linear-gradient(90deg,var(--grid-major) 1px,transparent 1px) -1px -1px/120px 120px,
  linear-gradient(var(--grid) 1px,transparent 1px) -1px -1px/24px 24px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) -1px -1px/24px 24px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.8) 55%,rgba(0,0,0,.45) 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.8) 55%,rgba(0,0,0,.45) 100%)}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;line-height:1.25}
/* DIN für Titel, Zahlen und kurze Beschriftungen */
#top h1,.sec-h h2,.mbox h3,.brand,#nav a,.tag,.chip,.pill,.badge,.btn,.seg button,.tabs button,.grp,.stat b,.gchip,.gbig,.favg,
.calnav b,.cal-head,.cal-wk,.cal-day .dn,.wk-day,.today-hero,.fcard b,.ycard b,.ycard .big,label.lbl,.fab,.toast button{
  font-family:var(--font-d);font-stretch:87.5%;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
small,.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
.hidden,[hidden]{display:none!important}

/* ---------- Layout ---------- */
#app{min-height:100vh}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 8px;
  background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-strong);min-height:56px}
#top h1{font-size:1.3125rem;font-weight:600;letter-spacing:.005em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
#top .tbtns{display:flex;gap:2px;align-items:center}
#saved{font-size:.78rem;color:var(--muted);opacity:0;transition:opacity .3s;white-space:nowrap;margin-right:4px}
#saved.on{opacity:1}
.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);position:relative}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
.icon-btn.sync.spin .ic{animation:spin 1s linear infinite}
.icon-btn.busy{pointer-events:none;opacity:.55}
.icon-btn.busy .ic{animation:spin 1s linear infinite}
.icon-btn.sync.err{color:var(--danger)}
.icon-btn.sync.off{color:var(--muted)}
.icon-btn.sync.ok{color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
#view{padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 90px);max-width:940px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);color:var(--muted);font-size:.8rem;font-weight:500;position:relative}
#nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:460px){#nav a{font-size:.74rem;padding:0 1px}}
@media (max-width:400px){#nav a{font-size:.7rem}#nav a .ic{width:19px;height:19px}}
#nav a.on{color:var(--text);font-weight:600}
#nav a.on .ic{color:var(--brand)}
#nav a.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--brand)}
#nav .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:var(--radius-s);background:var(--danger);color:#fff;font-size:.74rem;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
#nav .dot{position:absolute;top:10px;left:calc(50% + 8px);width:9px;height:9px;border-radius:2px;background:var(--danger)}
.brand{display:none}
@media (min-width:900px){
  #nav{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;gap:2px;padding:16px 12px;border-top:0;border-right:1px solid var(--line-strong);background:var(--card);backdrop-filter:none}
  #nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 14px;border-radius:var(--radius);font-size:1.05rem}
  #nav a:hover{background:var(--bg)}
  #nav a.on{background:var(--bg)}
  #nav a.on::before{top:8px;bottom:8px;left:0;right:auto;width:4px;height:auto;border-radius:0 2px 2px 0}
  #nav .badge{position:static;margin-left:auto}
  #nav .dot{position:static;margin-left:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3125rem;padding:4px 14px 20px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .brand img{width:36px;height:36px;display:block;flex:none}
  #main{margin-left:224px}
  /* PC: Plus-Taster in die freie rechte Ecke neben der Inhaltsspalte; unten so viel Platz,
     dass am Seitenende nichts darunter verschwindet (z. B. die Kalender-Legende) */
  #view{padding-bottom:116px}
  .fab{right:24px!important;bottom:28px!important}
}

/* ---------- Basics ---------- */
section{margin:0 0 26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;margin:4px 0 10px;padding:0 2px 6px;border-bottom:2px solid var(--text)}
.sec-h h2{font-size:1.125rem;font-weight:600;flex:1 1 auto;min-width:0}
.sec-h a{font-size:.9rem}
/* Farbe je Inhaltstyp: Fällig rot, Aufgaben blau, Arbeiten orange, Termine türkis, Noten grün */
.sec-h.kc{border-bottom-color:var(--k)}
.sec-h.kc h2::before{content:"";display:inline-block;width:11px;height:11px;border-radius:1px;background:var(--k);margin-right:8px;vertical-align:.05em}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:1.0625rem;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 86%,#000);border-color:color-mix(in srgb,var(--brand) 86%,#000);color:var(--brand-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{min-height:34px;padding:5px 11px;font-size:.95rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp,select.inp,textarea.inp{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius);padding:10px 12px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
textarea.inp{resize:none;line-height:1.5;min-height:96px}
label.lbl{display:block;font-size:.9rem;font-weight:500;color:var(--muted);margin:12px 2px 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--text);cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:38px;height:38px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ico.k-paper{background:#fff3e0;color:#c2410c}.ico.k-both{background:#e6f7ee;color:#15803d}
@media (prefers-color-scheme:dark){.ico.k-paper{background:#3a2a17;color:#fdba74}.ico.k-both{background:#15301f;color:#86efac}}
.badges{display:flex;gap:8px;color:var(--muted);font-size:.82rem;align-items:center}
.badges i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.badges .ic{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-s);padding:3px 9px;font-size:.9rem;background:var(--accent-soft);color:var(--accent);font-weight:500;border:0}
.chip.btnlike{cursor:pointer;background:var(--card);border:1px solid var(--line-strong);color:var(--text);padding:5px 11px}
.chip.btnlike.on{background:var(--text);color:var(--card);border-color:var(--text)}
/* Bereiche: Schule blau, Alltag türkis */
.chip.btnlike[data-v="schule"] .ic{color:var(--accent)}
.chip.btnlike[data-v="alltag"] .ic{color:var(--accent2)}
.chip.btnlike.on[data-v="schule"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.btnlike.on[data-v="alltag"]{background:var(--accent2);border-color:var(--accent2);color:var(--accent2-ink)}
.chip.btnlike.on .ic{color:inherit}
.chip .x{cursor:pointer;display:inline-flex}
.chip .x .ic{width:13px;height:13px}
/* Wahlschalter: eine Stellung ist aktiv */
.seg{display:flex;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:3px;gap:3px}
.seg button{flex:1;min-width:0;white-space:nowrap;border:0;background:transparent;padding:8px 2px;border-radius:var(--radius-s);cursor:pointer;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;font-size:1rem}
.seg button.on{background:var(--text);color:var(--card)}
.spacesw{margin-bottom:16px}
.tag.space-schule{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tag.space-alltag{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ic{width:42px;height:42px;opacity:.55;margin-bottom:8px}
.empty p{margin:6px auto 14px;max-width:34ch}
/* Hauptaktion als Taster: Rot mit Tastenkante */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:15;height:52px;padding:0 20px 0 16px;border-radius:var(--radius);border:1.5px solid var(--brand-edge);background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.125rem;box-shadow:0 3px 0 var(--brand-edge);cursor:pointer}
.fab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-edge)}
.fab .ic{width:22px;height:22px}

/* ---------- Cards ---------- */
.ycard,.fcard{display:block;color:var(--text);padding:14px 16px;position:relative;overflow:hidden}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--accent))}
.fcard{padding-left:22px}
.fcard b,.ycard b{display:block;font-size:1.1875rem;font-weight:600;margin-bottom:2px}
.ycard .big{font-size:2.25rem;font-weight:600;line-height:1.05;margin-bottom:2px}
.crumb{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin:2px 2px 10px}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fhead .dotc{width:14px;height:14px;border-radius:2px;background:var(--c)}
.tabs{display:flex;gap:3px;margin:0 0 16px;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:3px}
.tabs button{flex:1;min-width:0;white-space:nowrap;border:0;background:transparent;padding:9px 4px;border-radius:var(--radius-s);cursor:pointer;font-weight:500;font-size:1.0625rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--text);color:var(--card)}
.tabs .n{font-size:.85rem;background:var(--bg);border-radius:2px;padding:0 5px;color:var(--muted)}
.tabs button.on .n{background:color-mix(in srgb,var(--card) 22%,transparent);color:var(--card)}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filters .inp{flex:1;min-width:150px}
.filters select.inp{width:190px;max-width:100%;flex:none;text-overflow:ellipsis}

/* ---------- Doc ---------- */
.titleinp{font-size:1.25rem;font-weight:700;line-height:1.3;border:0;background:transparent;padding:6px 2px;width:100%;outline:none;min-height:0;border-bottom:2px solid transparent;resize:none;overflow:hidden;display:block;font-family:inherit}
.titleinp:focus{border-bottom-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;background:var(--card);min-height:44px}
.tagbox input{border:0;outline:0;background:transparent;flex:1;min-width:90px;padding:4px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--accent-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pn{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;border-radius:8px;padding:1px 8px;font-weight:650}
.ph .ocrd{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:2px;display:flex}
.ph .ocrd .ic{width:13px;height:13px}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.72rem;padding:16px 6px 5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.add{border:2px dashed var(--line);background:transparent;flex-direction:column;gap:6px;font-weight:600;font-size:.85rem}
.ph.add:hover{border-color:var(--accent);color:var(--accent)}
.ph .cl{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:.75rem}
.ph.cloud .cl{display:flex}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hint{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
.place{display:flex;gap:8px;align-items:center}

/* ---------- Todos ---------- */
.todo{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
/* Lernfeld-/Kategorie-Farbe als „Ader“ am linken Rand */
.todo.wired::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:0 2px 2px 0;background:var(--c)}
.todo .chk{width:26px;height:26px;border-radius:var(--radius-s);border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.todo.p2 .chk{border-color:var(--danger)}
.todo.done .chk{background:var(--ok);border-color:var(--ok)}
.todo .chk .ic{width:16px;height:16px;stroke-width:3}
.todo .tbody{flex:1;min-width:0;cursor:pointer}
.todo .ttl{font-weight:580;word-break:break-word}
.todo.done .ttl{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:.875rem}
/* Beschriftungen wie Klemmenschilder: eckig, DIN */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-s);padding:1px 7px;background:var(--bg);color:var(--muted);font-weight:500;border:1px solid var(--line);line-height:1.35}
.tag.due-over{background:transparent;color:var(--danger);border-color:var(--danger)}
.tag.due-today{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.tag.p2{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.tag.fld{background:var(--card);color:var(--text);border-color:var(--line-strong)}
.tag.fld::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--c,var(--muted));flex:none}
.tag .ic{width:13px;height:13px}
.grp{font-size:1rem;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.grp.over{color:var(--danger)}
.quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick .inp{flex:1;min-width:180px}
.quick input[type=date]{flex:none;width:auto;min-width:150px}
.subrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.subrow input[type=checkbox]{width:20px;height:20px;flex:none}
.subrow .inp{min-height:38px;padding:6px 10px}

/* ---------- Modal / Toast / Lightbox ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.mbox{background:var(--card);width:100%;max-width:520px;border-radius:10px 10px 0 0;border-top:4px solid var(--text);padding:18px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .18s}
@media (min-width:700px){.modal{align-items:center}.mbox{border-radius:var(--radius)}}
.mbox h3{font-size:1.3125rem;font-weight:600;margin-bottom:6px}
.mbox p{margin:6px 0 4px;color:var(--muted)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:14px 8px;text-align:left;cursor:pointer;border-radius:var(--radius);font-weight:550}
.menu button:hover{background:var(--accent-soft)}
.menu button.danger{color:var(--danger)}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.colors button.on{border-color:var(--text)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media (min-width:900px){#toasts{bottom:24px;left:224px}}
.toast{pointer-events:auto;background:#18212c;color:#fff;border-radius:var(--radius);border-left:4px solid var(--signal);padding:11px 16px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;max-width:460px;font-size:.95rem;animation:up .18s}
.toast.err{background:#9e1218;border-left-color:#fff}
.toast button{border:0;background:transparent;color:var(--signal);font-weight:600;font-size:1.05rem;cursor:pointer;padding:0}
#lb{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;color:#fff;touch-action:manipulation}
#lb .lb-top,#lb .lb-bot{display:flex;align-items:center;gap:4px;padding:calc(8px + var(--safe-t)) 8px 8px;background:rgba(0,0,0,.6)}
#lb .lb-bot{padding:8px 8px calc(10px + var(--safe-b));flex-wrap:wrap}
#lb .icon-btn{color:#fff}
#lb .icon-btn:hover{background:rgba(255,255,255,.15)}
#lb .lb-title{flex:1;text-align:center;font-weight:600;font-size:.95rem}
#lb .lb-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0}
#lb .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#lb .lb-stage.zoom{align-items:flex-start;justify-content:flex-start}
#lb .lb-stage.zoom img{max-width:none;max-height:none;width:240%;cursor:zoom-out}
#lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lb .lb-nav.prev{left:6px}#lb .lb-nav.next{right:6px}
#lb .lb-cap{flex:1;min-width:180px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;min-height:40px}
#lb .lb-cap::placeholder{color:rgba(255,255,255,.55)}
#lb .lb-msg{color:#cbd5e1;text-align:center;padding:20px}

/* ---------- Settings ---------- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.kv:last-child{border:0}
details.guide{margin-top:12px}
details.guide summary{cursor:pointer;font-weight:650;padding:6px 0}
details.guide ol{padding-left:20px;margin:8px 0}
details.guide li{margin-bottom:8px}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-weight:650;padding:8px 2px;color:var(--muted);display:flex;align-items:center;gap:8px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary .ic{width:17px;height:17px}
details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:auto;transition:transform .15s}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more[open] summary{color:var(--text)}
code{background:var(--accent-soft);padding:1px 6px;border-radius:var(--radius-s);font-size:.88em;word-break:break-all}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--radius-s);font-size:.9rem;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.err{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.pill.off{background:var(--line);color:var(--muted)}
.push-box{margin-top:16px;padding-top:14px;border-top:2px solid var(--line)}
.push-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.push-h h3{font-family:var(--font-d);font-size:1.05rem;font-weight:600}
.push-h .pill{white-space:nowrap;flex-shrink:0}
.snip{font-size:.85rem;color:var(--muted)}
.snip mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}

@media (max-width:430px){
  .tabs button .ic,.seg button .ic{display:none}
  .tabs button{font-size:.9rem}.seg button{font-size:.88rem}
}

/* ---------- Kalender ---------- */
.calnav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.calnav b{font-size:1.3125rem;font-weight:600;min-width:0;text-align:center;white-space:nowrap}
.cal-grid{display:grid;grid-template-columns:28px repeat(7,1fr);gap:3px}
.cal-head{font-size:.85rem;color:var(--muted);text-align:center;font-weight:500;padding-bottom:4px}
.cal-wk{border:0;background:transparent;color:var(--muted);font-size:.78rem;font-weight:500;border-radius:var(--radius-s);cursor:pointer;padding:8px 0 0;display:flex;justify-content:center;align-items:flex-start}
.cal-wk:hover{background:var(--accent-soft);color:var(--accent)}
/* Monatskalender auf eigener Fläche; jeder Tag deckend (nichts vom Hintergrund scheint durch) */
.cal-panel{padding:8px 8px 10px}
@media (min-width:900px){.cal-panel{padding:12px 12px 14px}}
.cal-panel .legend{margin-top:12px;padding:10px 4px 0;border-top:1px solid var(--line)}
.cal-day{position:relative;aspect-ratio:1/1;border:0;border-radius:var(--radius-s);background-color:var(--cell);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:5px 2px 4px;cursor:pointer;color:var(--text)}
.cal-day:hover{outline:1px solid var(--line-strong);outline-offset:-1px}
.cal-day .dn{font-size:1rem;font-weight:500;line-height:1}
.cal-day.today{outline:2px solid var(--signal);outline-offset:-2px}
.cal-day.today .dn{background:var(--signal);color:var(--signal-ink);min-width:24px;height:22px;padding:0 3px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-day.weekend{background-color:var(--cell-we)}
.cal-day.tt{background-color:color-mix(in srgb,var(--tc) 22%,var(--cell));box-shadow:inset 0 -5px 0 var(--tc)}
.cal-day.out{background-color:var(--cell-out);box-shadow:none}
.cal-day.out>*{opacity:.38}
.cal-day.out.holiday{background-image:none}
.cal-day.weekend .dn{color:var(--muted)}
/* Feiertag: schraffiert wie eine freie Fläche auf der Zeichnung */
.cal-day.holiday{background-image:var(--hatch)}
.cal-day.holiday .dn{color:var(--danger);font-weight:600}
.cal-day.today.holiday .dn{color:var(--signal-ink)}
.cal-day .dn{position:relative;display:inline-flex}
.cal-day .holidot{display:none}
.cal-day.override::before{content:"";position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:1px;background:var(--accent2)}
.cal-day .dots{display:flex;gap:2px}
.cal-day .dots i{width:6px;height:6px;border-radius:50%;display:block}
.cal-day .dots i.event{border-radius:1px}
.turnus-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.turnus-row:last-child{border-bottom:0}
.turnus-row.now{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--signal)}
.tw-label{min-width:130px}
.tw-label b,.tw-label small{display:block}
.tw-label b{font-family:var(--font-d);font-stretch:87.5%;font-weight:600;font-size:1.0625rem}
.tw-chips{display:flex;flex-wrap:wrap;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.92rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;height:14px;border-radius:2px;background:linear-gradient(to top,var(--c) 0 4px,color-mix(in srgb,var(--c) 22%,var(--cell)) 4px);display:block}
.legend i.hol{background:var(--hatch);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
@media (max-width:400px){.cal-grid{grid-template-columns:22px repeat(7,1fr);gap:2px}.cal-day .dn{font-size:.9rem}.calnav b{font-size:1.125rem}}

/* ---------- Kalender-Hintergrundbild (Bennys Bild „Bergsee bei Nacht“, nur Dunkelmodus) ----------
   Zum Entfernen: diesen Block, die Klasse „bild“ an .cal-panel in vCalMonth() und kalender-bild.webp löschen.
   Lesbarkeit: dunkler Verlauf über dem Bild, Tage halb durchsichtig, Schatten unter der Schrift; Mond oben hinter der Wochentagszeile. */
@media (prefers-color-scheme:dark){
  .cal-panel.bild{background:linear-gradient(180deg,rgba(9,12,16,.30),rgba(9,12,16,.10) 45%,rgba(9,12,16,.45)),url("kalender-bild.webp") 72% 100%/auto 112% no-repeat,#0d1116;
    --cell:rgba(24,31,40,.48);--cell-we:rgba(14,18,23,.55);--cell-out:rgba(10,13,17,.45)}
  .cal-panel.bild .cal-day .dn{text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}
  .cal-panel.bild .cal-head,.cal-panel.bild .cal-wk,.cal-panel.bild .legend{color:#c9d2db;text-shadow:0 1px 2px rgba(0,0,0,.9)}
  .cal-panel.bild .legend{border-top-color:rgba(255,255,255,.14)}
}
@media (prefers-color-scheme:dark) and (min-width:900px){.cal-panel.bild{background-position:center,72% 28%;background-size:auto,cover}}

/* ---------- Start: Tageskopf mit Turnus-Klemmleiste ---------- */
.today-hero{padding:14px 14px 12px;border-top:4px solid var(--brand)}
.th-top{display:flex;align-items:flex-start;gap:12px}
.th-num{font-size:3.25rem;font-weight:700;line-height:.86;letter-spacing:-.01em}
.th-meta{flex:1;min-width:0;padding-top:2px}
.th-meta b{display:block;font-size:1.3125rem;font-weight:600;line-height:1.1}
.th-meta span{display:block;font-size:1rem;color:var(--muted);margin-top:2px}
.th-kw{flex:none;border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:2px 7px;font-size:.95rem;color:var(--muted);line-height:1.3}
.th-state{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.th-state .st{display:inline-flex;align-items:center;gap:7px;font-size:1.0625rem;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-s);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--text);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.th-state .st::before{content:"";width:10px;height:10px;border-radius:1px;background:var(--c)}
.th-state .st.hol{--c:var(--danger)}
.th-state .st.hol::before{background:var(--hatch);box-shadow:inset 0 0 0 1px var(--danger)}
.th-state .st.free{--c:var(--line-strong);font-weight:500;color:var(--muted)}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:14px;border:1px solid var(--line-strong);border-radius:var(--radius-s);overflow:hidden;background:var(--card)}
.wk-day{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 0;cursor:pointer;color:var(--text);min-width:0}
.wk-day+.wk-day{box-shadow:inset 1px 0 0 var(--line)}
.wk-day:hover{background:var(--bg)}
.wk-day small{font-size:.85rem;color:var(--muted);font-weight:500;line-height:1.1}
.wk-day .dn{font-size:1.3125rem;font-weight:600;line-height:1.1}
.wk-day .band{align-self:stretch;height:8px;margin-top:6px;background:var(--c,transparent)}
.wk-day.hatch .band{background:var(--hatch);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--danger) 40%,transparent)}
.wk-day.holiday .dn{color:var(--danger)}
.wk-day.weekend{background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.wk-day.weekend .dn{color:var(--muted)}
.wk-day.today{background:color-mix(in srgb,var(--signal) 16%,var(--card))}
.wk-day.today::after{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--signal)}
.wk-day.today .dn{color:var(--text);font-weight:700}
.wk-day .idot{position:absolute;top:8px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wk-day.override .band{box-shadow:inset 0 -2px 0 var(--accent2)}
/* Sonn- und Feiertage rot wie im Wandkalender */
.wk-day.sun small,.wk-day.sun .dn,.cal-day.sun .dn,.cal-head:nth-child(8){color:var(--danger)}
.cal-day.today.sun .dn{color:var(--signal-ink)}
@media (max-width:400px){.th-num{font-size:2.75rem}.wk-day .dn{font-size:1.125rem}.wk-day .idot{right:3px}}
@media (prefers-color-scheme:dark){.wk-day.today{background:rgba(245,183,0,.09)}.wk-day.weekend{background:rgba(0,0,0,.18)}}

/* ---------- Übersicht im Lernfeld / Noten ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--tone,var(--text));border-radius:var(--radius-s);padding:8px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--text)}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--accent);border-top-color:var(--tone,var(--accent))}
.stat small{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:1.5rem;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-good{--tone:var(--ok)}.g-ok{--tone:var(--accent)}.g-warn{--tone:var(--warn)}.g-bad{--tone:var(--danger)}
.stat.k-exam{--tone:var(--orange)}.stat.k-todo{--tone:var(--accent)}.stat.k-event{--tone:var(--accent2)}
.stat[class*=" g-"] b{color:var(--tone)}
.gchip{flex:none;min-width:48px;height:36px;padding:0 8px;border-radius:var(--radius-s);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3125rem;
  color:var(--tone,var(--text));background:color-mix(in srgb,var(--tone,var(--muted)) 12%,transparent);border:1px solid color-mix(in srgb,var(--tone,var(--muted)) 40%,transparent)}
.favg{position:absolute;top:12px;right:12px;font-size:.95rem;font-weight:700;color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 45%,transparent);border-radius:var(--radius-s);padding:0 6px}
.fcard:has(.favg) b{padding-right:62px}
.yavg{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.yavg b,.yavg small{display:block}
.gbig{font-size:2.25rem;font-weight:700;line-height:1.1;color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 45%,transparent);border-top-width:3px;border-radius:var(--radius-s);padding:2px 12px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:.9rem;cursor:pointer;padding:0}
@media (max-width:400px){.stat{padding:9px 8px 8px}.stat b{font-size:1rem}}
@media (max-width:560px){.tabs.tabs4{display:grid;grid-template-columns:1fr 1fr}}

/* ---------- Startbildschirm (installierte App) ---------- */
#splash{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:#10151b;color:#e4e9ee;transition:opacity .35s ease,transform .35s ease;animation:spAuto .3s 4s forwards}
@media (display-mode:standalone){#splash{display:flex}}
#splash::before,#splash::after{content:"";position:absolute;inset:0;pointer-events:none}
#splash::before{background:radial-gradient(70% 45% at 92% 0%,rgba(255,43,71,.34),transparent 70%),radial-gradient(70% 45% at 0% 100%,rgba(61,139,253,.24),transparent 70%),linear-gradient(#1a232e,#0b0f14)}
#splash::after{background:linear-gradient(rgba(169,196,224,.07) 1px,transparent 1px) -1px -1px/24px 24px,linear-gradient(90deg,rgba(169,196,224,.07) 1px,transparent 1px) -1px -1px/24px 24px;
  -webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
#splash>*{position:relative;z-index:1}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-dial{position:relative;width:240px;height:240px;display:grid;place-items:center}
.sp-traces{position:absolute;left:50%;top:50%;width:900px;height:80px;transform:translate(-50%,-50%);overflow:visible}
.sp-ring{position:absolute;inset:0;width:100%;height:100%;animation:spTurn 1s cubic-bezier(.2,.8,.2,1) both}
.sp-dial img{position:relative;width:124px;height:124px;border-radius:50%;box-shadow:0 0 0 6px #10151b}
.sp-name{font-family:var(--font-d);font-size:1.9rem;font-weight:700;letter-spacing:.01em;margin-top:14px}
.sp-seam{display:block;width:170px;height:2px;margin:10px 0 9px;background:linear-gradient(90deg,transparent 2%,#ff8a1f 25%,#ffe2a8 50%,#ff8a1f 75%,transparent 98%);
  box-shadow:0 0 10px 1px rgba(255,150,50,.6),0 0 26px 4px rgba(255,120,40,.22);animation:spSeam .8s .25s ease-out both}
.sp-sub{font-size:.95rem;color:#97a3b0}
@keyframes spTurn{from{transform:rotate(-75deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spSeam{from{transform:scaleX(0);opacity:0}}
@keyframes spAuto{to{opacity:0;visibility:hidden}}   /* Sicherheitsnetz, falls das Skript hängt */
@media (prefers-reduced-motion:reduce){.sp-ring,.sp-seam{animation:none}#splash{transition:opacity .2s}}

/* ---------- Toast ---------- */
function toast(msg, type = '', action) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) $('button', t).onclick = () => { t.remove(); action.fn(); };
  box.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : (type === 'err' ? 6500 : 3200));
}

/* ---------- IndexedDB ---------- */
let DB;
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('schulvault', 5);
    r.onupgradeneeded = () => {
      const d = r.result;
      // guard mit contains(): so bekommen auch bereits installierte Geräte die neuen Speicherbereiche, ohne die alten anzufassen
      COLL.forEach(c => { if (!d.objectStoreNames.contains(c)) d.createObjectStore(c, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');   // key = Anhang-ID bzw. 't:'+ID für Vorschaubilder
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');     // key = 'rev:'+ID → Revision des lokalen Blobs
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idb(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = DB.transaction(store, mode), s = t.objectStore(store);
    let out; const q = fn(s);

    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

const idbGet = (s, k) => idb(s, 'readonly', o => o.get(k));

// akzeptiert „2“, „2,3“, „2.5“, „2+“ (= 1,7) und „2-“ (= 2,3)
function parseGrade(raw) {

  else if (/^\d(\.\d{1,2})?$/.test(s)) v = +s;

}

/* ---------- Popup-Benachrichtigungen ----------
   Lokal (hier) nur, solange die App offen ist/im Hintergrund läuft. Bei geschlossener App schickt sie der
   Push-Dienst im Daten-Repo (dienst/erinnerungen.mjs) – mit denselben Regeln, Schlüsseln und Texten.
   Wer triggerTs/nextOccurrence/checkNotifications ändert, zieht dienst/erinnerungen.mjs mit.
   Damit nichts doppelt piept, merken sich App und Service Worker gezeigte Schlüssel im Cache 'sv-push-seen'. */
const PUSH_SEEN = 'sv-push-seen';
async function pushSeenKeys() {
  try {
    const c = await caches.open(PUSH_SEEN);
    return new Set((await c.keys()).map(r => decodeURIComponent(r.url.split('/__seen/')[1] || '')));
  } catch (e) { return new Set(); }
}

  try { caches.open(PUSH_SEEN).then(c => c.put(new Request('./__seen/' + encodeURIComponent(key)), new Response(String(now())))).catch(() => {}); } catch (e) { /* kein Cache-Speicher */ }
}

  try {
    const c = await caches.open(PUSH_SEEN);

  } catch (e) { /* egal */ }
}

}

      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, { body, icon: 'icon-192.png?v=tresor', badge: 'icon-192.png?v=tresor', tag: url + ':' + title, data: { url } });
    } else if ('Notification' in window) {
      new Notification(title, { body, icon: 'icon-192.png?v=tresor' });
    }

}

async function checkNotifications() {
  if (!('Notification' in window) || Notification.permission !== 'granted' || notifBusy) return;
  notifBusy = true;
  try { await checkNotificationsNow(); } finally { notifBusy = false; }
}
async function checkNotificationsNow() {
  const viaPush = await pushSeenKeys();   // schon per Push gezeigt → hier nicht noch mal
  let seen; try { seen = JSON.parse(localStorage.getItem('sv_notified') || '{}'); } catch (e) { seen = {}; }
  const nowTs = now(); let changed = false;
  const fire = (key, title, body, url) => {
    if (seen[key]) return;
    if (!viaPush.has(key)) { showNotif(title, body, url); markPushSeen(key); }
    seen[key] = nowTs; changed = true;
  };
  live('todos').filter(t => !t.done && t.due).forEach(t => {
    const ts = triggerTs(t.due, t.remind, t.notifyTime); if (ts == null || nowTs < ts) return;
    const f = byId('fields', t.fieldId);
    fire('t:' + t.id + ':' + t.due, 'Aufgabe fällig: ' + t.title, fmtDue(t.due) + (f ? ' · ' + f.name : ''), '#/todo');
  });
  live('exams').forEach(e => {
    const ts = triggerTs(e.date, e.remind, e.notifyTime); if (ts == null || nowTs < ts) return;
    const f = byId('fields', e.fieldId);
    fire('e:' + e.id + ':' + e.date, 'Arbeit: ' + e.title, fmtDue(e.date) + (f ? ' · ' + f.name : ''), '#/cal');
  });
  live('events').forEach(e => {
    const occ = nextOccurrence(e, today()); if (!occ) return;
    const ts = triggerTs(occ, e.remind, e.notifyTime); if (ts == null || nowTs < ts) return;
    const f = byId('fields', e.fieldId);
    fire('ev:' + e.id + ':' + occ, 'Termin: ' + e.title, fmtDue(occ) + (f ? ' · ' + f.name : ''), '#/cal');
  });
  if (changed) {
    const cutoff = nowTs - 60 * 86400000;
    Object.keys(seen).forEach(k => { if (seen[k] < cutoff) delete seen[k]; });

  }
}

   Abgleich:      pro Eintrag gewinnt die zuletzt geänderte Version ("last write wins")
   ===================================================================== */
const SYNC = { state: 'off', msg: '', running: false, again: false, progress: '' };
let syncTimer;

function cfg() {
  try { return Object.assign({ auto: true, branch: 'main' }, JSON.parse(localStorage.getItem('sv_cfg') || '{}')); }
  catch (e) { return { auto: true, branch: 'main' }; }
}
function saveCfg(c) { localStorage.setItem('sv_cfg', JSON.stringify(c)); }
const configured = () => { const c = cfg(); return !!(c.repo && c.token); };
const lastSync = () => Number(localStorage.getItem('sv_last') || 0);

function setSync(state, msg) {
  SYNC.state = state; SYNC.msg = msg || '';
  if (typeof updateSyncUI === 'function') updateSyncUI();
}

async function gh(c, method, path, body, accept) {
  const r = await fetch((c.api || 'https://api.github.com') + path, {
    method, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + c.token, Accept: accept || 'application/vnd.github+json' },
      body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch (e) { /* kein JSON */ }
    const err = new Error(m || 'HTTP ' + r.status); err.status = r.status; throw err;
  }
  return r;
}
function friendlyErr(e) {
  if (e.status === 401) return 'Token ungültig oder abgelaufen';
  if (e.status === 403) return /rate|abuse|secondary/i.test(e.message) ? 'GitHub-Limit erreicht – bitte später erneut versuchen' : 'Keine Berechtigung – der Token braucht „Contents: Read and write“';
  if (e.status === 404) return 'Repository nicht gefunden – Name und Token-Zugriff prüfen';
  if (e.name === 'TypeError') return 'Keine Verbindung zu GitHub';
  return e.message || 'Unbekannter Fehler';
}
const blobToB64 = b => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(',')[1] || '');
  fr.onerror = () => rej(fr.error);
  fr.readAsDataURL(b);
});
function strToB64(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const remotePath = a => `files/${a.id}-${a.rev}`;

async function ghTree(c) {
  try {
    const r = await gh(c, 'GET', `/repos/${c.repo}/git/trees/${encodeURIComponent(c.branch || 'main')}?recursive=1`);
    const j = await r.json(); const files = new Map(); let dataSha = null;
    for (const t of j.tree || []) {
      if (t.type !== 'blob') continue;
      if (t.path === 'data.json') dataSha = t.sha; else if (t.path.startsWith('files/')) files.set(t.path, t.sha);
    }
    return { dataSha, files };
  } catch (e) {
    if (e.status === 409) return { dataSha: null, files: new Map() };   // leeres Repo
    throw e;
  }
}
const ghRaw = (c, sha) => gh(c, 'GET', `/repos/${c.repo}/git/blobs/${sha}`, null, 'application/vnd.github.raw+json');

function snapshot() { const o = { v: 1, app: 'schulvault', saved: now() }; COLL.forEach(k => o[k] = S[k]); return o; }

/* Fremde Daten einmischen. Neuere Einträge gewinnen. */
function mergeIn(data) {
  let changed = false, needPush = false;
  for (const k of COLL) {
    const remote = new Map(((data && data[k]) || []).map(x => [x.id, x]));
    const local = new Map(S[k].map(x => [x.id, x]));
    for (const [id, r] of remote) {
      const l = local.get(id);
      if (!l) { S[k].push(r); persist(k, r); changed = true; }
      else if ((r.updatedAt || 0) > (l.updatedAt || 0)) {
        Object.keys(l).forEach(p => delete l[p]); Object.assign(l, r); persist(k, l); changed = true;
        if (k === 'atts' && l.deleted) dropLocalBlob(l.id);
      }
    }
    for (const [id, l] of local) {
      const r = remote.get(id);
      if (!r || (r.updatedAt || 0) < (l.updatedAt || 0)) needPush = true;
    }
  }
  return { changed, needPush };
}

async function saveDownloaded(a, buf) {
  const blob = new Blob([buf], { type: a.mime || 'application/octet-stream' });
  await resetThumb(a.id); await putBlob(a.id, blob, a.rev);
}

async function syncBlobs(c, remote) {
  let changed = false;
  const ups = [], downs = [], dels = [];
  const byAtt = new Map();
  for (const [p, sha] of remote.files) {
    const id = p.slice(6).split('-')[0];
    if (!byAtt.has(id)) byAtt.set(id, []);
    byAtt.get(id).push({ p, sha });
  }
  for (const a of S.atts) {
    if (a.deleted) { (byAtt.get(a.id) || []).forEach(f => dels.push(f)); continue; }
    const has = await idbHas('blobs', a.id), lr = await idbGet('meta', 'rev:' + a.id);
    const rsha = remote.files.get(remotePath(a));
    if (has && lr === a.rev) { if (!rsha) ups.push(a); }
    else if (rsha && (a.size || 0) <= AUTO_DL) downs.push({ a, sha: rsha });
  }
  let i = 0;
  for (const f of dels) {
    SYNC.progress = 'Räume auf…'; if (typeof updateSyncUI === 'function') updateSyncUI();
    try { await gh(c, 'DELETE', `/repos/${c.repo}/contents/${f.p}`, { message: 'delete ' + f.p, sha: f.sha, branch: c.branch }); }
    catch (e) { if (![404, 409, 422].includes(e.status)) throw e; }
  }
  for (const a of ups) {
    SYNC.progress = `Lade hoch ${++i}/${ups.length}`; if (typeof updateSyncUI === 'function') updateSyncUI();
    const b = await getBlob(a.id); if (!b) continue;
    try { await gh(c, 'PUT', `/repos/${c.repo}/contents/${remotePath(a)}`, { message: 'add ' + a.name, content: await blobToB64(b), branch: c.branch }); }
    catch (e) { if (![409, 422].includes(e.status)) throw e; }
  }
  i = 0;
  for (const d of downs) {
    SYNC.progress = `Lade herunter ${++i}/${downs.length}`; if (typeof updateSyncUI === 'function') updateSyncUI();
    const r = await ghRaw(c, d.sha);
    await saveDownloaded(d.a, await r.arrayBuffer()); changed = true;
  }
  return { changed };
}

async function ghPutData(c, sha) {
  await gh(c, 'PUT', `/repos/${c.repo}/contents/data.json`, {
    message: 'LifeVault ' + new Date().toISOString(),
    content: strToB64(JSON.stringify(snapshot())), branch: c.branch, sha: sha || undefined
  });
}

async function runSync(manual = false) {
  const c = cfg();
  if (!c.repo || !c.token) { if (manual) { toast('Sync ist noch nicht eingerichtet'); location.hash = '#/settings'; } return; }
  if (SYNC.running) { SYNC.again = true; return; }
  if (!navigator.onLine) { setSync('err', 'Offline – Sync folgt, sobald du online bist'); if (manual) toast('Offline', 'err'); return; }
  SYNC.running = true; setSync('syncing', 'Synchronisiere …'); flushAll();
  let anyChange = false;
  try {
    for (let attempt = 0; ; attempt++) {
      const remote = await ghTree(c);
      let rdata = null;
      if (remote.dataSha) rdata = JSON.parse(await (await ghRaw(c, remote.dataSha)).text());
      const m = mergeIn(rdata); if (m.changed) anyChange = true;
      const b = await syncBlobs(c, remote); if (b.changed) anyChange = true;
      if (!rdata || m.needPush) {
        try { await ghPutData(c, remote.dataSha); }
        catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) continue; throw e; }
      }
      break;
    }
    if (dedupeTurnusTypes()) anyChange = true;   // von mehreren Geräten unabhängig angelegte Standard-Arten zusammenführen
    localStorage.setItem('sv_last', String(now()));
    setSync('ok', 'Synchronisiert');
    if (manual) toast('Synchronisiert ✓');
    if (anyChange && typeof rerenderSoon === 'function') rerenderSoon();
  } catch (e) {
    setSync('err', friendlyErr(e));
    if (manual) toast(friendlyErr(e), 'err');
  } finally {
    SYNC.running = false; SYNC.progress = '';
    if (typeof updateSyncUI === 'function') updateSyncUI();
    if (SYNC.again) { SYNC.again = false; scheduleSync(600); }
  }
}
function scheduleSync(ms = 4000) {
  const c = cfg(); if (!c.auto || !c.repo || !c.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { if (navigator.onLine) runSync(); }, ms);
}

/* Einzelne Datei bei Bedarf aus der Cloud holen */
async function downloadAtt(a) {
  const c = cfg(); if (!configured()) throw new Error('Sync ist nicht eingerichtet');
  const remote = await ghTree(c);
  const sha = remote.files.get(remotePath(a));
  if (!sha) throw new Error('Die Datei ist noch nicht in der Cloud – das andere Gerät muss zuerst synchronisieren');
  await saveDownloaded(a, await (await ghRaw(c, sha)).arrayBuffer());
}
async function ensureBlob(a) {
  const has = await idbHas('blobs', a.id), lr = await idbGet('meta', 'rev:' + a.id);
  if (has && (lr === a.rev || !configured())) return getBlob(a.id);
  try { await downloadAtt(a); }
  catch (e) { if (has) return getBlob(a.id); throw e; }
  return getBlob(a.id);
}

async function testConnection(c) {
  const r = await (await gh(c, 'GET', `/repos/${c.repo}`)).json();
  return { branch: r.default_branch || 'main', canPush: !r.permissions || r.permissions.push !== false, priv: r.private };
}

/* ---------- Push: Erinnerungen auch bei geschlossener App ----------
   Der Dienst läuft als GitHub Action im Daten-Repo (.github/workflows/erinnerungen.yml → dienst/erinnerungen.mjs).
   Die App legt dafür im Daten-Repo an: push/vapid.json (Push-Schlüssel, einmalig) und push/geraete.json
   (ein Eintrag pro Gerät mit Push-Abo). push/status.json schreibt nur der Dienst (gesendet, tote Abos, Tests).
   Auf dem Gerät: localStorage sv_push = { on, id, endpoint, checked }. Nichts davon gehört zu data.json. */
const PUSH_OK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushCfg() { try { return JSON.parse(localStorage.getItem('sv_push') || '{}') || {}; } catch (e) { return {}; } }
function savePushCfg(p) { localStorage.setItem('sv_push', JSON.stringify(p)); }
const pushOn = () => PUSH_OK && !!pushCfg().on;
const b64u = buf => { const b = new Uint8Array(buf); let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), ch => ch.charCodeAt(0));
const endpointId = async ep => b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ep))).slice(0, 16);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function ghJson(c, path) {
  try {
    const j = await (await gh(c, 'GET', `/repos/${c.repo}/contents/${path}?ref=${encodeURIComponent(c.branch || 'main')}`)).json();
    const bin = atob((j.content || '').replace(/\s/g, ''));
    return { data: JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))) || 'null'), sha: j.sha };
  } catch (e) { if (e.status === 404) return { data: null, sha: null }; throw e; }
}
const ghPutJson = (c, path, data, sha, message) => gh(c, 'PUT', `/repos/${c.repo}/contents/${path}`,
  { message, content: strToB64(JSON.stringify(data, null, 1) + '\n'), branch: c.branch, sha: sha || undefined });

function deviceName() {
  const u = navigator.userAgent;
  const os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Windows/.test(u) ? 'Windows' : /Mac OS X/.test(u) ? 'Mac' : /CrOS/.test(u) ? 'Chromebook' : /Linux/.test(u) ? 'Linux' : 'Gerät';
  const br = /Edg\//.test(u) ? 'Edge' : /SamsungBrowser/.test(u) ? 'Samsung Internet' : /Firefox\//.test(u) ? 'Firefox' : /OPR\//.test(u) ? 'Opera' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ', ' + br;
}
/* Push-Schlüssel (VAPID) holen bzw. beim allerersten Mal erzeugen und ins private Daten-Repo legen */
async function pushVapid(c) {
  const cur = (await ghJson(c, 'push/vapid.json')).data;
  if (cur && cur.publicKey && cur.jwk) return cur;
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const v = { v: 1, publicKey: b64u(await crypto.subtle.exportKey('raw', kp.publicKey)), jwk: { kty: 'EC', crv: 'P-256', x: jwk.x, y: jwk.y, d: jwk.d },
    subject: location.protocol === 'https:' ? new URL('./', location.href).href : '', createdAt: now() };
  try { await ghPutJson(c, 'push/vapid.json', v, null, 'Push: Schlüssel angelegt'); return v; }
  catch (e) {
    if (e.status === 409 || e.status === 422) { const again = (await ghJson(c, 'push/vapid.json')).data; if (again && again.publicKey) return again; }   // anderes Gerät war schneller
    throw e;
  }
}
/* push/geraete.json lesen, ändern, schreiben – bei gleichzeitigen Änderungen neu versuchen */
async function pushEditDevices(c, message, fn) {
  for (let i = 0; ; i++) {
    const { data, sha } = await ghJson(c, 'push/geraete.json');
    const doc = data && Array.isArray(data.geraete) ? data : { v: 1, geraete: [] };
    if (fn(doc.geraete) === false) return doc;   // nichts zu ändern
    try { await ghPutJson(c, 'push/geraete.json', doc, sha, message); return doc; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i < 3) { await sleep(1200 * (i + 1)); continue; } throw e; }
  }
}
async function pushSubscription(vapid) {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  const key = sub && sub.options && sub.options.applicationServerKey;
  if (sub && (!key || b64u(key) !== vapid.publicKey)) { await sub.unsubscribe().catch(() => {}); sub = null; }
  return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(vapid.publicKey) });
}
async function pushEnable() {
  const c = cfg();
  if (!PUSH_OK) throw new Error('Dieser Browser kann keine Push-Nachrichten empfangen');
  if (!configured()) throw new Error('Richte zuerst den Sync ein – Push braucht dein Daten-Repo');
  if (Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') throw new Error('Benachrichtigungen sind für diese Seite nicht erlaubt');
  const vapid = await pushVapid(c);
  const st = (await ghJson(c, 'push/status.json')).data, tot = (st && st.tot) || {};
  let sub = await pushSubscription(vapid);
  if (tot[await endpointId(sub.endpoint)]) { await sub.unsubscribe().catch(() => {}); sub = await pushSubscription(vapid); }   // Dienst meldet das Abo als abgelaufen
  const j = sub.toJSON(), p = pushCfg(), id = p.id || uid(), name = deviceName();
  const dead = new Set();
  for (const g of ((await ghJson(c, 'push/geraete.json')).data || {}).geraete || []) if (g && g.endpoint && tot[await endpointId(g.endpoint)]) dead.add(g.endpoint);
  await pushEditDevices(c, 'Push: ' + name + ' aktiviert', list => {
    // Aufräumen: abgelaufene Abos und dieselbe Adresse unter anderer ID (z. B. nach „Alles löschen“)
    for (let i = list.length - 1; i >= 0; i--) if (list[i].id !== id && (list[i].endpoint === j.endpoint || dead.has(list[i].endpoint))) list.splice(i, 1);
    let me = list.find(g => g.id === id);
    if (!me) { me = { id, createdAt: now() }; list.push(me); }
    Object.assign(me, { name, endpoint: j.endpoint, keys: { p256dh: j.keys.p256dh, auth: j.keys.auth }, updatedAt: now() });
    delete me.test;
  });
  savePushCfg({ on: true, id, endpoint: j.endpoint, checked: now() });
}
async function pushDisable() {
  const p = pushCfg();
  try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) { /* schon weg */ }
  savePushCfg({ id: p.id });
  if (!configured() || !p.id) return true;
  try {
    await pushEditDevices(cfg(), 'Push: ' + deviceName() + ' ausgeschaltet', list => {
      const n = list.length; for (let i = list.length - 1; i >= 0; i--) if (list[i].id === p.id || list[i].endpoint === p.endpoint) list.splice(i, 1);
      return list.length !== n;
    });
    return true;
  } catch (e) { return false; }   // egal: das Abo ist abgemeldet, der Dienst sortiert es beim nächsten Lauf aus
}
/* Testnachricht: im eigenen Geräte-Eintrag vormerken und den Dienst möglichst sofort starten */
async function pushTest(again) {
  const c = cfg(), p = pushCfg();
  const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
  const neu = async () => { if (again) throw new Error('Push ließ sich nicht neu anmelden – schalte es aus und wieder ein'); await pushEnable(); return pushTest(true); };
  if (!sub || sub.endpoint !== p.endpoint) return neu();
  const stamp = new Date().toISOString(); let found = false;
  await pushEditDevices(c, 'Push: Testnachricht angefordert', list => { const me = list.find(g => g.id === p.id); if (me) { me.test = stamp; found = true; } return found; });
  if (!found) return neu();
  try { await gh(c, 'POST', `/repos/${c.repo}/actions/workflows/erinnerungen.yml/dispatches`, { ref: c.branch || 'main' }); return true; }
  catch (e) { return false; }   // Token darf Actions nicht starten → nächster regulärer Lauf
}
/* Beim Start: Abo noch gültig und im Daten-Repo eingetragen? Sonst still neu anmelden (höchstens alle 12 h im Netz prüfen) */
async function pushCheck() {
  const p = pushCfg();
  if (!pushOn() || !configured() || !navigator.onLine || Notification.permission !== 'granted') return;
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub && sub.endpoint === p.endpoint) {
      if (now() - (p.checked || 0) < 12 * 3600e3) return;
      const c = cfg(), st = (await ghJson(c, 'push/status.json')).data;
      const dead = !!(st && st.tot && st.tot[await endpointId(sub.endpoint)]);
      const doc = (await ghJson(c, 'push/geraete.json')).data;
      if (!dead && doc && (doc.geraete || []).some(g => g.id === p.id && g.endpoint === sub.endpoint)) { savePushCfg(Object.assign(p, { checked: now() })); return; }
    }
    await pushEnable();
  } catch (e) { /* nächster Start versucht es erneut */ }
}

/* ---------- Dialoge (ohne natives confirm/prompt – die funktionieren in installierten PWAs nicht zuverlässig) ---------- */
function askModal(html, setup) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;
    let closed = false;
    const done = v => { if (closed) return; closed = true; m.remove(); res(v); };
    m._done = done;
    m.addEventListener('mousedown', e => { if (e.target === m) done(null); });
    document.body.appendChild(m);
    $$('[data-close]', m).forEach(b => b.addEventListener('click', () => done(null)));
    if (setup) setup(m, done);
  });
}
function promptModal({ title, label = '', value = '', placeholder = '', ok = 'Speichern' }) {

    <div class="mact"><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary">${esc(ok)}</button></div></form>`,

    const inp = $('input', m); setTimeout(() => { inp.focus(); inp.select(); }, 30);

}

}

function todoRow(t, opt = {}) {

/* ---------- Router ---------- */
function render(nav = false) {

const NAV_ITEMS = [

/* ---------- Ansicht: Start (Dashboard) ---------- */
function dashSection(title, link, rows, k = '') {
  if (!rows.length) return '';
  return `<section><div class="sec-h${k ? ' kc" style="--k:' + k : ''}"><h2>${esc(title)}</h2>${link ? `<a href="#${link}">Alle</a>` : ''}</div><div class="card">${rows.join('')}</div></section>`;
}
const WD_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
function weekStripHTML(t0) {
  const mon = mondayOf(parseYmd(t0));
  const openDue = new Set(todosOpen().filter(t => t.due).map(t => t.due));
  // Woche als Klemmleiste: unten ein Band in der Farbe der Turnus-Art, Feiertage schraffiert
  let h = `<div class="week-strip" role="group" aria-label="Diese Woche">`;
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const dy = ymd(d), isToday = dy === t0, weekend = isWeekend(dy), hol = holidayOn(dy);
    const tt = effectiveDayType(dy), ov = dayOverride(dy), showT = tt && (!hol || ov);
    const hasItems = live('exams').some(e => e.date === dy) || eventsOnDay(dy).length > 0 || openDue.has(dy);
    const label = [fmtDate(dy), showT ? tt.name : '', hol || '', hasItems ? 'mit Einträgen' : ''].filter(Boolean).join(', ');
    h += `<button class="wk-day ${isToday ? 'today' : ''} ${weekend ? 'weekend' : ''} ${d.getDay() === 0 ? 'sun' : ''} ${hol ? 'holiday' : ''} ${hol && !showT ? 'hatch' : ''} ${ov ? 'override' : ''}"${showT ? ` style="--c:${tt.color}"` : ''} data-a="cal-day" data-date="${dy}" aria-label="${esc(label)}"${isToday ? ' aria-current="date"' : ''}>
      <small>${WD_SHORT[i]}</small><span class="dn">${d.getDate()}</span>${hasItems ? '<i class="idot"></i>' : ''}<span class="band"></span></button>`;
  }
  return h + `</div>`;
}
function todayHeroHTML(t0) {
  const d0 = parseYmd(t0), tt = effectiveDayType(t0), hol = holidayOn(t0), ov = dayOverride(t0);
  let state = '';
  if (hol) state += `<span class="st hol">${esc(hol)}</span>`;
  if (tt && (!hol || ov)) state += `<span class="st" style="--c:${tt.color}">${esc(tt.name)}</span>`;
  else if (!hol && isWeekend(t0)) state += `<span class="st free">Wochenende</span>`;
  return `<div class="card today-hero">
    <div class="th-top"><b class="th-num">${d0.getDate()}</b>
      <div class="th-meta"><b>${esc(d0.toLocaleDateString('de-DE', { weekday: 'long' }))}</b><span>${esc(d0.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }))}</span></div>
      <span class="th-kw" title="Kalenderwoche">KW ${isoWeekNum(d0)}</span></div>
    ${state ? `<div class="th-state">${state}</div>` : ''}
    ${weekStripHTML(t0)}

}
function vDashboard() {
  const t0 = today();
  const openTodos = todosOpen();
  const overdue = sortTodos(openTodos.filter(t => t.due && t.due < t0));
  const dueToday = sortTodos(openTodos.filter(t => t.due === t0));
  const rest = sortTodos(openTodos.filter(t => !(t.due && t.due <= t0)));
  const nextExams = upcomingExams(3), nextEvents = upcomingEvents(3);
  let h = `<section>${todayHeroHTML(t0)}</section>`;
  h += dashSection('Fällig', '/todo', [...overdue, ...dueToday].map(t => todoRow(t)), 'var(--brand)');
  h += dashSection('Aufgaben', '/todo', rest.slice(0, 8).map(t => todoRow(t)), 'var(--accent)');
  h += dashSection('Anstehende Arbeiten', '/cal', nextExams.map(examRow), 'var(--orange)');
  h += dashSection('Anstehende Termine', '/cal', nextEvents.map(e => eventRow(e)), 'var(--accent2)');
  if (!overdue.length && !dueToday.length && !rest.length && !nextExams.length && !nextEvents.length) {

/* Übersicht eines Lernfelds/einer Kategorie: das Wichtigste auf einen Blick */

function fieldOverviewHTML(f, sp, todos) {

  const nextDue = open.find(t => t.due);

    const exams = live('exams').filter(e => e.fieldId === id);
    const upcoming = exams.filter(e => e.date >= t0).sort((a, b) => a.date.localeCompare(b.date));
    const past = exams.filter(e => e.date < t0).sort((a, b) => b.date.localeCompare(a.date));
    const nx = upcoming[0];
    h += `<div class="stats">
      ${statTile('Durchschnitt', grades.length ? `Ø ${fmtAvg(avg)}` : '–', grades.length ? `${grades.length} ${grades.length === 1 ? 'Note' : 'Noten'}` : 'keine Noten', grades.length ? gradeTone(avg) : '')}
      ${statTile('Nächste LK', nx ? esc(fmtDue(nx.date)) : '–', nx ? esc(nx.title) : 'nichts geplant', nx && daysBetween(t0, nx.date) <= 3 ? 'g-warn' : 'k-exam', nx ? `data-a="exam-edit" data-id="${nx.id}"` : '')}
      ${statTile('Aufgaben', String(open.length), nextDue ? 'nächste ' + esc(fmtDue(nextDue.due)) : (open.length ? 'ohne Datum' : 'alles erledigt'), 'k-todo', 'data-a="ftab" data-v="todos"')}
    </div>`;
    h += `<section><div class="sec-h kc" style="--k:var(--ok)"><h2>Noten</h2><button class="btn small" data-a="grade-new" data-f="${id}">${ic('plus')} Note</button></div>`;
    h += grades.length ? `<div class="card">${grades.map(gradeRow).join('')}</div>`
      : `<p class="hint" style="margin:0 2px">Noch keine Noten. Trag hier deine LK-, Test- oder mündlichen Noten ein – der Durchschnitt wird automatisch berechnet.</p>`;
    h += `</section><section><div class="sec-h kc" style="--k:var(--orange)"><h2>LKs &amp; Arbeiten</h2><button class="btn small" data-a="exam-new" data-f="${id}">${ic('plus')} LK</button></div>`;

    if (past.length) h += `<details class="more" style="margin-top:10px"><summary>${ic('cal')} Vergangene LKs (${past.length})</summary><div class="card" style="margin-top:8px">${past.map(e => examRow(e, { noField: true })).join('')}</div></details>`;
    h += `</section>`;
  } else {
    const evs = live('events').filter(e => e.fieldId === id).map(e => ({ e, occ: nextOccurrence(e, t0) })).filter(x => x.occ).sort((a, b) => a.occ.localeCompare(b.occ));
    const nx = evs[0];
    h += `<div class="stats">
      ${statTile('Nächster Termin', nx ? esc(fmtDue(nx.occ)) : '–', nx ? esc(nx.e.title) : 'nichts geplant', 'k-event', nx ? `data-a="event-edit" data-id="${nx.e.id}"` : '')}
      ${statTile('Aufgaben', String(open.length), nextDue ? 'nächste ' + esc(fmtDue(nextDue.due)) : (open.length ? 'ohne Datum' : 'alles erledigt'), 'k-todo', 'data-a="ftab" data-v="todos"')}

    </div>`;
    h += `<section><div class="sec-h kc" style="--k:var(--accent2)"><h2>Termine</h2><button class="btn small" data-a="event-new" data-f="${id}">${ic('plus')} Termin</button></div>`;
    h += evs.length ? `<div class="card">${evs.slice(0, 5).map(x => eventRow(x.e, x.occ)).join('')}</div>`

    h += `</section>`;
  }
  h += `<section><div class="sec-h kc" style="--k:var(--accent)"><h2>Offene Aufgaben</h2>${open.length > 4 ? `<button type="button" class="linkbtn" data-a="ftab" data-v="todos">Alle ${open.length}</button>` : ''}</div>`;
  h += open.length ? `<div class="card">${open.slice(0, 4).map(t => todoRow(t, { noField: true })).join('')}</div>`

const GRADE_KINDS = ['LK', 'Test', 'Mündlich', 'Referat', 'Projekt', 'Hausaufgabe', 'Zeugnis'];
function gradeModal(id, preset = {}) {

    <div class="chips" style="margin-top:8px">${GRADE_KINDS.map(k => `<button type="button" class="chip btnlike" data-gk="${esc(k)}">${esc(k)}</button>`).join('')}</div>

    <p class="hint" data-err style="color:var(--danger);display:none">Bitte eine Note zwischen 1 und 6 eingeben (z. B. 2, 2,3 oder 2-).</p>
    <div class="mact">${g ? `<button type="button" class="btn danger" data-del style="margin-right:auto">${ic('trash')}</button>` : ''}<button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary">Speichern</button></div></form>`,
  (m, done) => {
    const F = $('form', m);
    $$('[data-gk]', m).forEach(b => b.onclick = () => {
      const k = b.dataset.gk, n = live('grades').filter(x => x !== g && x.fieldId === F.field.value && (x.label || '').startsWith(k)).length;

    };
    F.onsubmit = ev => {

      const raw = F.grade.value.trim(), v = parseGrade(raw);
      if (v == null) { $('[data-err]', m).style.display = ''; F.grade.focus(); return; }
      const props = { value: v, raw: /[+-]/.test(raw) ? raw.replace(/\s+/g, '') : '', label: F.label.value.trim(), date: F.date.value || today(), fieldId: F.field.value || fid, note: F.note.value.trim() };
      if (g) { Object.assign(g, props); touch('grades', g); } else add('grades', props);
      done(true); render();
    };
    setTimeout(() => F.grade.focus(), 30);
  });
}
function docListHTML(docs) {

  if (q) list = list.filter(d => docHay(d).includes(q));
  list.sort(UI.dsort === 'name' ? (a, b) => cmp(a.title, b.title)

      : (a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
  if (!list.length) return `<div class="card empty">${ic('file')}<p>${docs.length ? 'Nichts gefunden.' : 'Noch keine Unterlagen in diesem Lernfeld. Lege mit „+ Unterlage“ die erste an.'}</p></div>`;

/* ---------- Ansicht: Aufgaben ---------- */
function vTodos() {
  let all = todosOfFilter(UI.filter); if (UI.tfield) all = all.filter(t => t.fieldId === UI.tfield);
  const open = all.filter(t => !t.done), done = all.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = spaceSwitcher();
  h += quickForm({ fieldId: UI.tfield, space: UI.filter });
  h += `<div class="filters"><div class="chips" style="flex:1">
      <button class="chip btnlike ${UI.tfilter === 'open' ? 'on' : ''}" data-a="tfilter" data-v="open">Offen · ${open.length}</button>
      <button class="chip btnlike ${UI.tfilter === 'done' ? 'on' : ''}" data-a="tfilter" data-v="done">Erledigt · ${done.length}</button></div>
    <select class="inp" data-a-change="tfield" aria-label="Nach ${FWORD[UI.filter] || FWORD_ALL} filtern"><option value="">Alle ${UI.filter === 'alltag' ? 'Kategorien' : UI.filter === 'schule' ? 'Lernfelder' : 'Lernfelder/Kategorien'}</option>${fieldOptions(UI.tfield, false, UI.filter)}</select></div>`;
  if (UI.tfilter === 'open') {
    if (!open.length) h += `<div class="card empty">${ic('check')}<p>Nichts offen. Trage oben eine Hausaufgabe oder Lernaufgabe ein.</p></div>`;
    const t0 = today(), g = { over: [], today: [], week: [], later: [], none: [] };
    for (const t of sortTodos(open)) {
      if (!t.due) g.none.push(t);
      else { const d = daysBetween(t0, t.due); (d < 0 ? g.over : d === 0 ? g.today : d <= 7 ? g.week : g.later).push(t); }
    }
    [['over', 'Überfällig', 'over'], ['today', 'Heute', ''], ['week', 'Nächste 7 Tage', ''], ['later', 'Später', ''], ['none', 'Ohne Datum', '']].forEach(([k, l, c]) => {
      if (g[k].length) h += `<div class="grp ${c}">${l} · ${g[k].length}</div><div class="card">${g[k].map(t => todoRow(t)).join('')}</div>`;
    });
  } else {
    h += done.length ? `<div class="card">${done.map(t => todoRow(t)).join('')}</div><div class="actions"><button class="btn danger small" data-a="todo-clear">${ic('trash')} Erledigte löschen</button></div>`
      : `<div class="card empty">${ic('check')}<p>Noch nichts erledigt.</p></div>`;
  }
  return { title: 'Aufgaben', back: '/inhalte', body: h };
}

}

/* ---------- Ansicht: Suche ---------- */
function snippet(text, q) {
  const i = (text || '').toLowerCase().indexOf(q); if (i < 0) return '';
  const s = Math.max(0, i - 30), e = Math.min(text.length, i + q.length + 60);
  return `<small class="snip">${s > 0 ? '…' : ''}${esc(text.slice(s, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>${esc(text.slice(i + q.length, e))}${e < text.length ? '…' : ''}</small>`;
}
const spTag = sp => `<span class="tag space-${sp}">${SPACES[sp].label}</span>`;
function searchHTML(raw) {
  const q = raw.trim().toLowerCase();
  if (q.length < 2) return `<p class="hint">Durchsucht Unterlagen (Titel, Notizen, Tags, Dateinamen, Beschriftungen), Lernfelder/Kategorien, Aufgaben, Notizen, Arbeiten und Termine – in Schule und Alltag.</p>`;
  let h = '';
  const docs = live('docs').filter(d => docHay(d).includes(q)).sort((a, b) => b.updatedAt - a.updatedAt);
  if (docs.length) h += `<div class="grp">Unterlagen · ${docs.length}</div><div class="card">${docs.map(d => {
    const f = byId('fields', d.fieldId), sp = spaceOfField(f);
    const ocrHit = live('atts').filter(a => a.docId === d.id).map(a => a.ocrText || '').find(t => t.toLowerCase().includes(q));
    const sn = snippet(d.note, q) || snippet((d.tags || []).join(' #'), q) || snippet(d.place, q) || snippet(ocrHit, q);
    return `<a class="row" href="#/d/${d.id}"><span class="ico k-${d.kind}">${ic(KINDS[d.kind]?.icon || 'file')}</span><span class="grow"><b>${esc(d.title || 'Ohne Titel')}</b><small>${esc(f ? f.name : '')}</small>${sn}</span>${spTag(sp)}</a>`;
  }).join('')}</div>`;
  const fs = live('fields').filter(f => (f.name + ' ' + (f.note || '')).toLowerCase().includes(q));
  const ys = live('years').filter(y => (y.name + ' ' + (y.note || '')).toLowerCase().includes(q));
  if (fs.length || ys.length) h += `<div class="grp">Lernfelder, Kategorien &amp; Schuljahre</div><div class="card">${fs.map(f => `<a class="row" href="#/f/${f.id}"><span class="ico" style="background:${f.color};color:#fff">${ic('folder')}</span><span class="grow"><b>${esc(f.name)}</b>${snippet(f.note, q) || `<small>${esc(yearOfField(f)?.name || SPACES[spaceOfField(f)].label)}</small>`}</span></a>`).join('')}
    ${ys.map(y => `<a class="row" href="#/y/${y.id}"><span class="ico">${ic('book')}</span><span class="grow"><b>${esc(y.name)}</b>${snippet(y.note, q)}</span></a>`).join('')}</div>`;
  const ts = live('todos').filter(t => (t.title + ' ' + (t.note || '') + ' ' + (t.subs || []).map(s => s.t).join(' ')).toLowerCase().includes(q));
  if (ts.length) h += `<div class="grp">Aufgaben · ${ts.length}</div><div class="card">${ts.map(t => todoRow(t, { tag: spTag(todoSpace(t)) })).join('')}</div>`;
  const ns = live('notes').filter(n => (n.text || '').toLowerCase().includes(q));
  if (ns.length) h += `<div class="grp">Notizen · ${ns.length}</div><div class="card">${ns.map(noteRow).join('')}</div>`;
  const es = live('exams').filter(e => (e.title + ' ' + (e.note || '')).toLowerCase().includes(q));
  if (es.length) h += `<div class="grp">Arbeiten · ${es.length}</div><div class="card">${es.map(examRow).join('')}</div>`;
  const evs = live('events').filter(e => (e.title + ' ' + (e.note || '')).toLowerCase().includes(q));
  if (evs.length) h += `<div class="grp">Termine · ${evs.length}</div><div class="card">${evs.map(e => eventRow(e)).join('')}</div>`;
  return h || `<div class="card empty">${ic('search')}<p>Keine Treffer für „${esc(raw.trim())}“.</p></div>`;
}

/* ---------- Foto-Viewer ---------- */
const LB = { ids: [], i: 0, open: false, tok: 0 };
function openLb(ids, i = 0) {
  LB.ids = ids.slice(); LB.i = i; LB.open = true;
  let el = $('#lb'); if (!el) { el = document.createElement('div'); el.id = 'lb'; document.body.appendChild(el); }

}
function lbClose() { const el = $('#lb'); if (el) el.remove(); if (LB.open) { LB.open = false; flushAll(); render(); } }
async function lbRender() {
  const a = byId('atts', LB.ids[LB.i]); if (!a) { lbClose(); return; }
  const photo = a.role === 'photo', n = LB.ids.length;
  $('#lb').innerHTML = `<div class="lb-top"><button class="icon-btn" data-a="lb-close" aria-label="Schließen">${ic('x')}</button>
    <div class="lb-title">${photo ? `Seite ${LB.i + 1} / ${n}` : esc(a.name)}</div>
    <button class="icon-btn" data-a="lb-dl" aria-label="Speichern">${ic('download')}</button><button class="icon-btn" data-a="lb-del" aria-label="Löschen">${ic('trash')}</button></div>
    <div class="lb-stage" id="lbst"><div class="lb-msg">Wird geladen …</div></div>
    ${n > 1 ? `<button class="lb-nav prev" data-a="lb-prev" aria-label="Vorherige">${ic('chevl')}</button><button class="lb-nav next" data-a="lb-next" aria-label="Nächste">${ic('chevr')}</button>` : ''}
    <div class="lb-bot">${photo ? `<input class="lb-cap" data-bind="atts.${a.id}.caption" value="${esc(a.caption || '')}" placeholder="Beschriftung, z. B. Tafelbild oder Seite 3" aria-label="Beschriftung">
      <button class="icon-btn" data-a="lb-ocr" aria-label="${a.ocrText ? 'Erkannten Text ansehen' : 'Text erkennen'}">${ic('scan')}</button>
      <button class="icon-btn" data-a="lb-rotl" aria-label="Links drehen">${ic('rotL')}</button><button class="icon-btn" data-a="lb-rotr" aria-label="Rechts drehen">${ic('rotR')}</button>
      <button class="icon-btn" data-a="lb-mvl" aria-label="Eine Seite nach vorn" ${LB.i === 0 ? 'disabled style="opacity:.3"' : ''}>${ic('left')}</button>
      <button class="icon-btn" data-a="lb-mvr" aria-label="Eine Seite nach hinten" ${LB.i === n - 1 ? 'disabled style="opacity:.3"' : ''}>${ic('right')}</button>` : ''}</div>`;
  const tok = ++LB.tok;
  try {
    await ensureBlob(a); const u = await fullURL(a);
    if (tok !== LB.tok) return;
    const st = $('#lbst'); if (!st) return;
    st.innerHTML = u ? `<img src="${u}" alt="${esc(a.caption || a.name)}">` : `<div class="lb-msg">Datei nicht verfügbar</div>`;
  } catch (e) { const st = $('#lbst'); if (st && tok === LB.tok) st.innerHTML = `<div class="lb-msg">${esc(e.message)}</div>`; }
}
async function lbMove(dir) {
  const j = LB.i + dir; if (j < 0 || j >= LB.ids.length) return;
  const a = byId('atts', LB.ids[LB.i]), b = byId('atts', LB.ids[j]); if (!a || !b) return;
  const t = a.order; a.order = b.order; b.order = t; touch('atts', a); touch('atts', b);
  [LB.ids[LB.i], LB.ids[j]] = [LB.ids[j], LB.ids[LB.i]]; LB.i = j; lbRender();
}
const lbStep = d => { if (LB.ids.length < 2) return; LB.i = (LB.i + d + LB.ids.length) % LB.ids.length; lbRender(); };

function wire() {

    const fn = ACT[el.dataset.a]; if (fn) fn(el, e);

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.bind) onBind(el);
